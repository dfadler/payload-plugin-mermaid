name: Security audit

# Dependency vulnerability gate. Fails the build if `pnpm audit` finds a NEW
# high- or critical-severity advisory in the production dependency tree.
# Runs on every PR, on pushes to main, and weekly (so a freshly-disclosed
# advisory against an unchanged tree still turns the schedule red).
#
# No allowlist exists yet — as of this workflow's introduction, `pnpm audit
# --prod --audit-level=high` is clean. If a future advisory has no available
# fix, add it to `auditConfig.ignoreGhsas` in pnpm-workspace.yaml (see
# dfadler/dfadler.com's security-audit.yml for the pattern) rather than
# disabling this check.
#
# Ported from dfadler/dfadler.com's security-audit.yml.

on:
  # Deliberately NOT scoped with `paths-ignore:` here — that filters at the
  # trigger level, so a markdown-only diff would mean the workflow never
  # runs at all. This is a required status check (branch protection), so
  # GitHub would then wait forever for a status that's never posted,
  # permanently blocking merge for any docs-only PR. Instead the `changes`
  # job below computes relevance and the `audit` job's `if:` skips based on
  # that — a *skipped* job still reports a status for its required-check
  # context, which GitHub treats as passing. The weekly schedule always
  # runs the full audit regardless (see `audit`'s `if:` below), so a
  # freshly-disclosed advisory is still caught even when nothing has changed.
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 08:00 UTC — catch advisories disclosed against an idle tree.
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: read-only; the gate only needs to check out and audit.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # No diff to compute for a cron trigger — the `audit` job's `if:` below
    # bypasses this job's output entirely on schedule.
    if: github.repository == 'dfadler/payload-plugin-mermaid' && github.event_name != 'schedule'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '**'
              - '!**/*.md'

  audit:
    name: pnpm audit (prod, high+)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `always()` so this job's `if:` is still evaluated even though
    # `changes` above is itself conditionally skipped (on fork or on
    # schedule) — without it, a skipped `needs` job would skip this one
    # implicitly. Same fork-of-this-fork guard as ci.yml's `test` job,
    # combined with: always run on the weekly schedule regardless of what
    # changed, otherwise only run when `changes` found a non-markdown diff.
    if: >-
      always() && github.repository == 'dfadler/payload-plugin-mermaid' &&
      (github.event_name == 'schedule' || needs.changes.outputs.relevant == 'true')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job runs PR-controlled code and never needs authenticated
          # git after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails (non-zero exit) on any high/critical prod advisory not listed
      # in pnpm-workspace.yaml `auditConfig.ignoreGhsas`.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
