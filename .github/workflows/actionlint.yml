name: Actionlint

# Lints the workflow YAML under .github/workflows/ itself — the one layer no
# job-level check can cover, because an invalid workflow file is rejected by
# GitHub before any job starts. actionlint also catches expression/type
# mistakes in ${{ }}, bad cron/glob syntax, unknown runner labels, and (via
# shellcheck) bugs in embedded `run:` scripts.
#
# Tools are pinned to exact versions so a new actionlint or shellcheck release
# adding a check can't turn a green main red without a deliberate bump here.
# Ported from dfadler/dfadler.com's actionlint.yml.

on:
  # Deliberately NOT scoped with `paths:` here (this lints .github/workflows/**
  # and nothing else needs to trigger it) — a `paths:`/`paths-ignore:` filter
  # on the *trigger* means the workflow never runs at all for a non-matching
  # diff, and this is a required status check (branch protection), so GitHub
  # would wait forever for a status that's never posted, permanently blocking
  # merge for any PR that doesn't touch .github/workflows/**. Instead the
  # `changes` job below computes relevance and the `actionlint` job's `if:`
  # skips based on that — a *skipped* job still reports a status for its
  # required-check context, which GitHub treats as passing.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: v0.11.0

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.repository == 'dfadler/payload-plugin-mermaid'
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'

  actionlint:
    name: actionlint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `always()` so this job's `if:` is still evaluated (and can skip
    # cleanly) even though `changes` above is itself conditionally skipped —
    # without it, a skipped `needs` job would skip this one implicitly and
    # `github.repository` guard would never get the chance to matter.
    if: >-
      always() && github.repository == 'dfadler/payload-plugin-mermaid' &&
      needs.changes.outputs.workflows == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job runs a downloaded binary against PR-controlled files and
          # never needs authenticated git — don't leave the GITHUB_TOKEN in
          # reach.
          persist-credentials: false

      # Pinned binary from upstream releases (first-party download only, to
      # match this repo's action set).
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint
          actionlint --version

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Lint workflows (actionlint)
        run: actionlint
