name: Supply chain

# Blocks known-malware dependencies from installing in CI, using Aikido Safe
# Chain (https://github.com/AikidoSec/safe-chain) — open source, tokenless,
# no build data shared.
#
# How it works: `--ci` installs Safe Chain's package-manager shims onto PATH
# ahead of the real binaries. The next `pnpm install` then routes every
# package download — including transitive deps — through Safe Chain's local
# proxy, which checks each one against Aikido Intel's malware feed. A package
# on that list makes the install exit non-zero and fails this check *before*
# the tarball is written to node_modules or any lifecycle script
# (preinstall/postinstall) runs. Detect, don't execute — this is what would
# catch a Shai-Hulud-class attack: a routine `pnpm install` that would
# otherwise fire a malicious `preinstall` never gets that far.
#
# Ported from dfadler/dfadler.com's supply-chain.yml.

on:
  # Deliberately NOT scoped with `paths-ignore:` here — that filters at the
  # trigger level, so a markdown-only diff would mean the workflow never
  # runs at all. This is a required status check (branch protection), so
  # GitHub would then wait forever for a status that's never posted,
  # permanently blocking merge for any docs-only PR. Instead the `changes`
  # job below computes relevance and the `malware-scan` job's `if:` skips
  # based on that (a markdown-only diff touches no dependency, so a
  # cold malware-scanned install here finds nothing new) — a *skipped* job
  # still reports a status for its required-check context, which GitHub
  # treats as passing.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the job only reads the repo.
permissions:
  contents: read

env:
  # Pinned to an exact release + checksum. GitHub release assets are
  # immutable, so this URL+hash pair can't change under us; bump both
  # together to upgrade Safe Chain.
  SAFE_CHAIN_VERSION: 1.5.15
  SAFE_CHAIN_SHA256: de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2
  # Safe Chain also blocks a package version published too recently (minimum
  # package age) — real protection against a third-party package that hasn't
  # had time to be caught yet, but a false alarm for a package this repo's
  # own maintainer publishes: zombie-mermaid (this same author's own package,
  # see pnpm-workspace.yaml's minimumReleaseAgeExclude) ships fresh releases
  # this repo consumes immediately, so there's no unknown-publisher window
  # to wait out. Comma-separated exact package names (or a trailing
  # "@scope/*" to trust a whole org).
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: zombie-mermaid

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.repository == 'dfadler/payload-plugin-mermaid'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '**'
              - '!**/*.md'

  malware-scan:
    name: Safe Chain (pnpm install)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `always()` so this job's `if:` is still evaluated even though
    # `changes` above is itself conditionally skipped (on fork) — without
    # it, a skipped `needs` job would skip this one implicitly. Same
    # fork-of-this-fork guard as ci.yml's `test` job.
    if: >-
      always() && github.repository == 'dfadler/payload-plugin-mermaid' &&
      needs.changes.outputs.relevant == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job runs PR-controlled code and never needs authenticated
          # git after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          # Deliberately NO `cache: pnpm` here. This job's whole purpose is
          # to route package downloads through Safe Chain's proxy, so we
          # want a cold install that actually fetches — a warm store would
          # let cached tarballs skip the scan.

      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o /tmp/install-safe-chain.sh
          echo "${SAFE_CHAIN_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # `pnpm` on PATH is now Safe Chain's shim. A frozen-lockfile install
      # that resolves a package on Aikido's malware list exits non-zero,
      # failing the check. On a clean tree this is a normal install.
      - name: Install dependencies (malware-scanned)
        run: pnpm install --frozen-lockfile
